
  <!DOCTYPE html>
  <html lang="en" data-surface="clay">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- The weights the sign-in screen paints with, fetched in parallel with the JS instead of after the CSS is parsed.
           Plex Serif is the wide-screen brand panel only (hidden below the lg breakpoint, 1024px). crossorigin is required
           for font preloads even though the files are same-origin. -->
      <link rel="preload" href="/src/assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
      <link rel="preload" href="/src/assets/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
      <link rel="preload" href="/src/assets/fonts/archivo-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
      <link rel="preload" href="/src/assets/fonts/ibm-plex-serif-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin media="(min-width: 1024px)" />
      <title>BloodLink Web Application Design</title>
      <meta name="description" content="Streamline blood supply management for hospitals and blood banks with real-time inventory tracking, emergency sourcing, and donor coordination features." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function () {
          // Light is the default for a first-time visitor with nothing
          // stored yet — deliberately not a prefers-color-scheme mirror.
          // Must match getStoredTheme()'s fallback in src/app/lib/theme.ts.
          try {
            var stored = localStorage.getItem("bloodlink-theme");
            if (stored === "dark") document.documentElement.classList.add("dark");
          } catch (e) {}
        })();
      </script>

    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
